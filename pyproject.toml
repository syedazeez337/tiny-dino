[project]
name = "tiny-dino"
version = "0.1.0"
description = "A 21,699-parameter MLP that plays a deterministic Chromium Dino runner with no planner, solver, or safety shield."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    "torch>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "tiny-tictactoe",
]

[project.scripts]
tiny-dino = "tiny_dino.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_dino"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
tiny-tictactoe = { path = "tiny-tictactoe" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
packages = ["tiny_dino"]
