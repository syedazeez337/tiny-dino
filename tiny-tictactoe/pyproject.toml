[project]
name = "tiny-tictactoe"
version = "0.1.0"
description = "A 22,281-parameter MLP that plays perfect tic-tac-toe, distilled from an exact minimax teacher."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.2",
    "torch>=2.7",
    "uvicorn>=0.34",
]

[project.scripts]
tiny-ttt = "tiny_ttt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_ttt"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]
