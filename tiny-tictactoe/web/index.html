<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Tic-Tac-Toe</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Tiny Tic-Tac-Toe</h1>
      <p class="sub">
        A 22,281-parameter MLP distilled from an exact minimax teacher. No search at run time.
      </p>
    </header>

    <main>
      <section class="board-wrap">
        <div class="board" id="board" aria-label="tic-tac-toe board"></div>
        <div class="banner" id="banner">Choose a side and start a new game.</div>
      </section>

      <aside class="panel">
        <div class="badge">UNASSISTED NEURAL POLICY</div>

        <div class="controls">
          <label>
            You play
            <select id="human">
              <option value="x">X (first)</option>
              <option value="o">O (second)</option>
            </select>
          </label>
          <button id="new">New game</button>
        </div>

        <div class="status" id="status">idle</div>

        <div class="metrics">
          <div><span>Model move</span><b id="mmove">–</b></div>
          <div><span>Latency</span><b id="latency">–</b></div>
        </div>

        <div class="probs-title">Move probabilities</div>
        <div class="probs" id="probs"></div>

        <div class="card" id="card">loading model…</div>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
